<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi ruta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="config.js"></script>
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#14213d;--mute:#5b6b8c;--or:#f7b500;--or2:#ffd84d;--soft:#fff1bd;--ok:#1a9a4f;--bad:#d62828;--sh:0 6px 18px rgba(20,33,61,.10);--line:#ece4c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;background:#ffffff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:var(--sh);flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:26px;height:26px}
header h1{font-size:18px;margin:0;font-weight:800;line-height:1.1}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.hi{font-size:26px;font-weight:800;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.card.wide{grid-column:1/-1}
.lbl{font-size:13px;color:var(--mute);font-weight:600}
.big{font-size:23px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.small{font-size:12px;color:var(--mute);margin-top:4px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}.foot b{font-size:17px}
.bar{height:9px;border-radius:9px;background:var(--soft);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or2),var(--or));border-radius:9px}
h2{font-size:17px;margin:22px 0 10px;font-weight:800}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--or);margin-right:6px;vertical-align:-1px}
.legend span.m:before{background:var(--ink);height:3px;width:14px;border-radius:2px;vertical-align:3px}
.tw{overflow-x:auto;padding:12px 8px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{font-size:10.5px;color:var(--mute);text-align:right;padding:6px 3px;font-weight:600;white-space:nowrap}
td{padding:9px 3px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;font-weight:800}
tfoot td{font-weight:800}
label{display:block;font-size:12px;color:var(--mute);font-weight:600;margin:12px 0 5px}
input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--or);outline-offset:1px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 16px;background:var(--or);color:#14213d;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ink)}
#msg{font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
.li{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
#sheet{position:fixed;inset:0;z-index:50}
.shbg{position:absolute;inset:0;background:rgba(20,33,61,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(20,33,61,.25)}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.shx{position:absolute;top:18px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:22px;cursor:pointer}
.wk{font-size:12px;font-weight:800;color:#8a6300;text-transform:uppercase;padding-right:48px}
.rt{font-size:26px;font-weight:800;margin:2px 0 12px}.rt small{font-size:16px;margin-left:8px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--soft)}
.sum span{display:block;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase}.sum b{font-size:18px}
.dh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin:16px 0 4px}
.dd{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed var(--line);border-radius:18px;margin-bottom:10px;color:var(--mute)}
.dd.on{border:1px solid var(--line);box-shadow:var(--sh);color:var(--ink)}
.bd{width:54px;height:54px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;line-height:1.1;flex:none}.bd b{font-size:20px}
.dd.on .bd{background:var(--ink);color:#fff}
.di{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px}.di b{font-size:16px;color:var(--ink)}
.dr{text-align:right;display:flex;flex-direction:column;font-size:12px;font-weight:700}.dr b{font-size:17px;color:var(--ink)}
#lock{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#lkF{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
#lock h2{margin:0;font-size:22px}#lock p{max-width:340px;color:var(--mute);margin:0;font-size:14px}
.app,nav{visibility:hidden}body.in .app,body.in nav{visibility:visible}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font:inherit;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 10px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -6px 20px rgba(20,33,61,.12);display:flex;justify-content:center;gap:8px}
nav button{flex:1;max-width:170px;font:inherit;font-size:12px;font-weight:700;background:none;border:0;color:var(--mute);padding:6px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--ink);background:var(--soft)}
button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="lock"><h2 id="lkT">Verificando acceso…</h2><p id="lkP">Un momento, por favor.</p>
  <div id="lkF" hidden><input id="lkE" type="email" placeholder="tu@correo.com" autocomplete="email" aria-label="Correo"><button class="btn" id="lkS">Enviar enlace de acceso</button></div>
  <button class="btn g" id="lkB" hidden>Cerrar sesión</button></div>
<div class="app">
<header>
  <div class="logo" id="logo"></div>
  <div><h1 id="cname">Mi Empresa</h1><p id="date"></p></div><button class="btn g" id="out" hidden style="margin-left:auto;padding:6px 12px;font-size:12px">Salir</button>
</header>
<p class="hi">Hola 👋</p>
<p class="sub">Escribe tu ruta para ver tu información · cifras en cajas</p>
<div class="card">
  <label for="tI" style="margin-top:0">Mi ruta</label>
  <input id="tI" list="tL" placeholder="Ruta 01" autocomplete="off" autocapitalize="characters"><datalist id="tL"></datalist>
  <div class="small bad" id="tE" role="status"></div>
</div>
<div id="tB" style="margin-top:12px"></div>
</div>
<script>
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var AB=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var SKU=[['t355','Tonicol 355 ml'],['t600','Tonicol 600 ml'],['t2l','Tonicol 2 L'],['yau','Yauco 1/2 L'],['titan','Familia Titan']];
var S={name:'Mi Empresa',user:'',logo:'',metas:{},sales:{},sku:{},off:[]},FB=null,AU=null,TV='m',RT='',unlocked=false;
try{RT=localStorage.getItem('termRoute')||''}catch(e){}
var $=function(i){return document.getElementById(i)};
var pad=function(n){return('0'+n).slice(-2)};
var fm=function(n){return Math.round(n).toLocaleString('es-MX')};
var kd=function(t){return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
var wd=function(t){return t.getDay()!==0&&S.off.indexOf(kd(t))<0};
var lab=function(y,m){var n=new Date(y,m+1,0).getDate(),c=0;for(var i=1;i<=n;i++)if(wd(new Date(y,m,i)))c++;return c};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cls(p){return p>=100?'ok':'bad'}
function cl(o){return JSON.parse(JSON.stringify(o))}
var LOGO='<svg viewBox="0 0 24 24" fill="none" stroke="#14213d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11M10 19V6M16 19v-9M21 19H3"/></svg>';
function applyCfg(d){if(!d)return;S.name=d.name||S.name;S.logo=d.logo||'';S.metas=cl(d.metas||{});S.off=cl(d.off||[])}
function applySales(d){S.sales=d?cl(d.sales||{}):{}}
function applySku(d){S.sku=d?cl(d.sku||{}):{}}
function showLogin(t,p,nof){document.body.classList.remove('in');$('lock').hidden=false;$('lkT').textContent=t||'Mi ruta';$('lkP').textContent=p||'Inicia sesión con tu correo. Te enviaremos un enlace de acceso.';$('lkF').hidden=!!nof;$('lkB').hidden=!nof}
function noAccess(em){showLogin('Sin acceso','El correo '+em+' no tiene acceso. Pide al administrador que te lo autorice.',true)}

function routes(){var o={};Object.keys(S.sales).forEach(function(k){for(var r in S.sales[k])o[r]=1});Object.keys(S.metas).forEach(function(k){for(var r in S.metas[k].r)o[r]=1});
  var n=function(x){var v=parseInt(x,10);return isNaN(v)?999:v};return Object.keys(o).sort(function(a,b){return n(a)-n(b)||a.localeCompare(b)})}
function parseR(t){t=String(t||'').trim().toUpperCase();var m=/(\d+)/.exec(t);if(m)return String(parseInt(m[1],10));if(/OXXO/.test(t))return 'OXXO';if(/KIOSKO/.test(t))return 'KIOSKO';return ''}
function rName(r){return/^\d+$/.test(r)?'Ruta '+r:r}
function calc(r){
  var now=new Date(),Y=now.getFullYear(),M=now.getMonth(),d=now.getDate(),dim=new Date(Y,M+1,0).getDate(),mk=Y+'-'+pad(M+1),mt=S.metas[mk]||{t:0,r:{}};
  var keys=Object.keys(S.sales).sort(),cut=keys.length?keys[keys.length-1]:'',cd=cut.slice(0,7)===mk?+cut.slice(8):0;
  var nd=function(a,b){var c=0;for(var i=a;i<=b;i++)if(wd(new Date(Y,M,i)))c++;return c};
  var we=nd(1,cd),wr=nd(cd+1,dim),mes=0;
  keys.forEach(function(k){if(k.slice(0,7)===mk)mes+=+S.sales[k][r]||0});
  var mg=(mt.r[r]||0)*mt.t,dg=mg/(lab(Y,M)||1),dow=(now.getDay()+2)%7,sem=0,sg=0,wk=0,wdays=[],mon=new Date(Y,M,d-dow),sun=new Date(Y,M,d-dow+6);
  for(var i=0;i<7;i++){var t=new Date(Y,M,d-dow+i);if(t.getDay()===0)continue;var k=kd(t),m2=S.metas[t.getFullYear()+'-'+pad(t.getMonth()+1)],g=m2&&m2.r[r]?m2.t*m2.r[r]/(lab(t.getFullYear(),t.getMonth())||1):0,v=S.sales[k]?+S.sales[k][r]||0:0;
    if(wd(t)&&cut&&k<=cut)wk++;sem+=v;sg+=g;wdays.push({t:t,k:k,v:v,g:g,has:!!S.sales[k],fut:k>cut})}
  return{Y:Y,M:M,dim:dim,mk:mk,cut:cut,we:we,wr:wr,mes:mes,mg:mg,dg:dg,sem:sem,sg:sg,wk:wk,wdays:wdays,mon:mon,sun:sun}}
function dayItems(c){var its=[],i;
  if(TV==='m'){for(i=1;i<=c.dim;i++){var t=new Date(c.Y,c.M,i);if(t.getDay()===0)continue;var k=kd(t);its.push({a:String(i),v:S.sales[k]?+S.sales[k][RT]||0:0,has:!!S.sales[k],g:c.dg,fut:k>c.cut})}}
  else c.wdays.forEach(function(x){its.push({a:DN[x.t.getDay()]+' '+x.t.getDate(),v:x.v,has:x.has,g:x.g,fut:x.fut})});
  return its}
function dayChart(its){
  var W=400,H=210,T=30,B=30,L=6,ph=H-T-B,n=its.length||1,cw=(W-2*L)/n,bw=Math.min(30,cw*.7),mx=1,ga=0,g='';
  its.forEach(function(x){if(x.v>mx)mx=x.v;if(x.g>mx)mx=x.g;ga+=x.g});ga=its.length?ga/its.length:0;mx*=1.15;
  g+='<line x1="'+L+'" x2="'+(W-L)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="var(--line)"/>';
  if(ga>0){var gy=T+ph-ga/mx*ph;g+='<line x1="'+L+'" x2="'+(W-L)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>'}
  its.forEach(function(x,i){var cx=L+cw*(i+.5),h=x.has?Math.max(x.v/mx*ph,2):0;
    if(x.has)g+='<rect x="'+(cx-bw/2)+'" y="'+(T+ph-h)+'" width="'+bw+'" height="'+h+'" rx="'+Math.min(6,bw/3)+'" fill="'+(x.g>0&&x.v>=x.g?'var(--ok)':'var(--or)')+'"/>';
    else if(!x.fut)g+='<rect x="'+(cx-bw/2)+'" y="'+(T+ph-3)+'" width="'+bw+'" height="3" rx="1.5" fill="var(--soft)"/>';
    if(n<=8)g+='<text x="'+cx+'" y="'+(T+ph-h-6)+'" font-size="12" font-weight="800" text-anchor="middle" fill="var(--ink)">'+(x.has?fm(x.v):'–')+'</text>';
    g+='<text x="'+cx+'" y="'+(H-10)+'" font-size="'+(n>8?8.5:11)+'" font-weight="600" text-anchor="middle" fill="var(--mute)">'+esc(x.a)+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Venta por día">'+g+'</svg>'+(ga>0?'<div class="legend"><span>Venta</span><span class="m">Meta diaria: '+fm(ga)+' cj</span></div>':'')}
function skuAgg(c){var a={t355:0,t600:0,t2l:0,yau:0,titan:0,tot:0},days=0,miss=0,wk={};c.wdays.forEach(function(x){wk[x.k]=1});
  Object.keys(S.sku).forEach(function(k){if(!(TV==='m'?k.slice(0,7)===c.mk:wk[k]))return;var x=S.sku[k]&&S.sku[k].r&&S.sku[k].r[RT];if(!x){miss++;return}days++;for(var q in a)a[q]+=+x[q]||0});return{a:a,days:days,miss:miss}}
function skuSvg(a){
  var W=400,H=240,T=44,B=46,L=10,ph=H-T-B,n=SKU.length,cw=(W-2*L)/n,bw=46,mx=1,g='<line x1="'+L+'" x2="'+(W-L)+'" y1="'+(T+ph)+'" y2="'+(T+ph)+'" stroke="var(--line)"/>';
  SKU.forEach(function(s){if(a[s[0]]>mx)mx=a[s[0]]});mx*=1.05;
  SKU.forEach(function(s,i){var v=a[s[0]],cx=L+cw*(i+.5),h=v/mx*ph,p=a.tot?v/a.tot*100:0,w=s[1].split(' ');
    g+='<rect x="'+(cx-bw/2)+'" y="'+(T+ph-h)+'" width="'+bw+'" height="'+Math.max(h,2)+'" rx="7" fill="var(--or)"/>';
    g+='<text x="'+cx+'" y="'+(T+ph-h-18)+'" font-size="13" font-weight="800" text-anchor="middle" fill="var(--ink)">'+p.toFixed(1)+'%</text>';
    g+='<text x="'+cx+'" y="'+(T+ph-h-5)+'" font-size="11" text-anchor="middle" fill="var(--mute)">'+fm(v)+' cj</text>';
    g+='<text x="'+cx+'" y="'+(H-26)+'" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">'+esc(w[0])+'</text>';
    g+='<text x="'+cx+'" y="'+(H-12)+'" font-size="11" text-anchor="middle" fill="var(--mute)">'+esc(w.slice(1).join(' '))+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Venta por producto">'+g+'</svg>'}
function render(){
  $('cname').textContent=S.name||'Mi Empresa';document.title=(S.name||'Mi Empresa')+' · Mi ruta';
  $('logo').innerHTML=S.logo?'<img alt="Logotipo" src="'+S.logo+'">':LOGO;
  var ks=Object.keys(S.sales).sort(),cut=ks.length?ks[ks.length-1]:'';
  $('date').textContent=cut?'Datos al '+(+cut.slice(8))+' '+AB[+cut.slice(5,7)-1]:'Sin ventas cargadas';
  $('tL').innerHTML=routes().map(function(r){return '<option value="'+rName(r)+'">'}).join('');
  if(!RT||routes().indexOf(RT)<0){$('tB').innerHTML='<p class="small">Escribe tu ruta arriba (por ejemplo, Ruta 01) para ver tu información.</p>';return}
  var c=calc(RT),G=c.mg>0,pm=G?c.mes/c.mg*100:0,ps=c.sg>0?c.sem/c.sg*100:0,mo=c.mon,su=c.sun;
  var wl='Sem '+mo.getDate()+(mo.getMonth()===su.getMonth()?'':' '+AB[mo.getMonth()])+' - '+su.getDate()+' '+AB[su.getMonth()];
  var pc=function(v,ok){return ok?'<b class="'+cls(v)+'">'+v.toFixed(0)+'%</b>':'<b>–</b>'};
  var req=G&&c.wr>0?Math.max(c.mg-c.mes,0)/c.wr:null,ag=skuAgg(c),a=ag.a;
  var tg=function(v){return '<button class="'+(TV===v?'btn':'btn g')+'" data-v="'+v+'" style="padding:8px 14px">'+(v==='m'?'Mes':'Semana')+'</button>'};
  $('tB').innerHTML='<h2 style="margin-top:6px">'+rName(RT)+'</h2>'
   +'<div class="grid"><div class="card"><div class="lbl">Ventas del mes</div><div class="big">'+fm(c.mes)+'</div><div class="foot"><div><div class="lbl">% cumpl.</div>'+pc(pm,G)+'</div><div style="text-align:right"><div class="lbl">Meta mes</div><b>'+(G?fm(c.mg):'–')+'</b></div></div></div>'
   +'<div class="card"><div class="lbl">'+wl+'</div><div class="big">'+fm(c.sem)+'</div><div class="foot"><div><div class="lbl">% cumpl.</div>'+pc(ps,c.sg>0)+'</div><div style="text-align:right"><div class="lbl">Meta sem.</div><b>'+(c.sg>0?fm(c.sg):'–')+'</b></div></div></div>'
   +'<div class="card wide"><div class="foot" style="margin-top:0"><div><div class="lbl">Mi promedio diario actual</div><b style="font-size:24px">'+fm(c.we>0?c.mes/c.we:0)+' <span class="lbl">cj/día</span></b></div><div style="text-align:right"><div class="lbl">Objetivo diario requerido</div><b class="bad" style="font-size:24px">'+(req===null?'–':fm(req))+' <span class="lbl">cj/día</span></b></div></div>'
   +'<div class="small">'+(G?(c.wr>0?'Para lograr tu meta de '+fm(c.mg)+' cajas en los '+c.wr+' día(s) hábil(es) que quedan del mes.':'Ya no quedan días hábiles en el mes.'):'Sin meta asignada este mes.')+'</div></div></div>'
   +'<h2>Mi venta por día</h2><div style="display:flex;gap:8px;margin-bottom:8px">'+tg('m')+tg('s')+'</div>'
   +'<div class="card chart">'+dayChart(dayItems(c))+'</div>'
   +'<h2>Venta por producto</h2><div class="card"><div class="lbl">Total '+(TV==='m'?'del mes':'de la semana')+': '+fm(a.tot)+' cajas</div>'+(ag.days?skuSvg(a):'')
   +'<p class="small">'+(ag.days?'% sobre la venta total de tu ruta.':'Aún no hay detalle por producto de tu ruta en este periodo.')+(ag.days&&ag.miss?' Faltan '+ag.miss+' día(s) sin detalle.':'')+'</p></div>'}
$('tB').onclick=function(e){var b=e.target.closest('[data-v]');if(!b)return;TV=b.dataset.v;render()};
$('tI').oninput=function(){var v=this.value,r=parseR(v);if(!v.trim()){$('tE').textContent='';return}
  if(r&&routes().indexOf(r)>=0){RT=r;try{localStorage.setItem('termRoute',r)}catch(e){}$('tE').textContent='';render()}else $('tE').textContent='No encontré esa ruta.'};
function signOut(){(AU?AU.signOut():Promise.resolve()).then(function(){try{localStorage.removeItem('fbEmail')}catch(e){}location.reload()})}
$('lkB').onclick=signOut;$('out').onclick=signOut;
$('lkS').onclick=async function(){var e=$('lkE').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(e)){$('lkP').textContent='Escribe un correo válido.';return}
  $('lkS').disabled=true;
  try{await AU.sendSignInLinkToEmail(e,{url:location.origin+location.pathname,handleCodeInApp:true});try{localStorage.setItem('fbEmail',e)}catch(x){}
    $('lkP').textContent='Listo. Revisa tu correo ('+e+') y abre el enlace en este mismo dispositivo para entrar.'}
  catch(x){$('lkP').textContent='No se pudo enviar el enlace: '+(x&&x.message||'error')}
  $('lkS').disabled=false};
function unlock(){unlocked=true;document.body.classList.add('in');$('lock').hidden=true;$('out').hidden=false;$('tI').value=RT?rName(RT):'';render()}
async function boot(){
  try{
    if(!window.firebase||typeof FIREBASE_CONFIG==='undefined'||FIREBASE_CONFIG.projectId.indexOf('TU-')===0)return showLogin('Falta configurar Firebase','Edita config.js (ver README.md).',true);
    firebase.initializeApp(FIREBASE_CONFIG);AU=firebase.auth();FB=firebase.firestore();
    if(AU.isSignInWithEmailLink(location.href)){
      var e0=null;try{e0=localStorage.getItem('fbEmail')}catch(x){}
      if(!e0)e0=(prompt('Escribe tu correo para confirmar el acceso:')||'').trim().toLowerCase();
      try{await AU.signInWithEmailLink(e0,location.href);try{localStorage.removeItem('fbEmail')}catch(x){}history.replaceState(null,'',location.pathname)}
      catch(x){return showLogin('Enlace no válido','El enlace expiró, ya se usó o el correo no coincide. Pide uno nuevo.')}
    }
    var us=await new Promise(function(res){var off=AU.onAuthStateChanged(function(u){off();res(u)})});
    if(!us)return showLogin();
    var em=(us.email||'').toLowerCase(),me;
    try{me=await FB.doc('users/'+em).get()}catch(x){return noAccess(em)}
    if(!me.exists)return noAccess(em);
    var refs=['config','sales','sku'].map(function(k){return FB.doc('app/'+k)});
    var er=function(){if(!unlocked)showLogin('No se pudo cargar','No tienes acceso a los datos o hubo un problema de conexión.',true)};
    refs[0].onSnapshot(function(x){applyCfg(x.exists?x.data():null);if(unlocked)render();else unlock()},er);
    refs[1].onSnapshot(function(x){applySales(x.exists?x.data():null);if(unlocked)render()},er);
    refs[2].onSnapshot(function(x){applySku(x.exists?x.data():null);if(unlocked)render()},er)
  }catch(e){showLogin('No se pudo iniciar','Ocurrió un error al conectar. Revisa tu conexión e intenta de nuevo.',true)}
}
boot();
</script>
