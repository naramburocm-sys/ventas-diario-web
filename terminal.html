<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#14213d;--mute:#5b6b8c;--or:#f7b500;--or2:#ffd84d;--soft:#fff1bd;--ok:#1a9a4f;--bad:#d62828;--sh:0 6px 18px rgba(20,33,61,.10);--line:#ece4c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;background:#ffffff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:var(--sh);flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:26px;height:26px}
header h1{font-size:18px;margin:0;font-weight:800;line-height:1.1}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.hi{font-size:26px;font-weight:800;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.card.wide{grid-column:1/-1}
.lbl{font-size:13px;color:var(--mute);font-weight:600}
.big{font-size:23px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.small{font-size:12px;color:var(--mute);margin-top:4px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}.foot b{font-size:17px}
.bar{height:9px;border-radius:9px;background:var(--soft);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or2),var(--or));border-radius:9px}
h2{font-size:17px;margin:22px 0 10px;font-weight:800}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--or);margin-right:6px;vertical-align:-1px}
.legend span.m:before{background:var(--ink);height:3px;width:14px;border-radius:2px;vertical-align:3px}
label{display:block;font-size:12px;color:var(--mute);font-weight:600;margin:12px 0 5px}
input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--or);outline-offset:1px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 16px;background:var(--or);color:#14213d;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
#lock{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#lkF{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
#lock h2{margin:0;font-size:22px}#lock p{max-width:340px;color:var(--mute);margin:0;font-size:14px}
.app,nav{visibility:hidden}body.in .app,body.in nav{visibility:visible}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -6px 20px rgba(20,33,61,.12);display:flex;justify-content:center;gap:12px}
nav button{flex:1;max-width:210px;font:inherit;font-size:12px;font-weight:700;background:none;border:0;color:var(--mute);padding:6px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--ink);background:var(--soft)}
button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
[hidden]{display:none!important}

/* Estilos para la pestaña Clientes y Mapa */
.day-pills{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.day-pill{font:inherit;font-size:13px;font-weight:800;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:center}
.day-pill.act{background:var(--or);border-color:var(--or);color:#14213d}
.map-box{height:310px;width:100%;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);z-index:1}
.map-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:700;margin-top:10px;color:var(--ink)}
.dot-leg{display:inline-flex;align-items:center;gap:5px}
.dot-leg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.c-card{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);border:1.5px solid var(--line);margin-bottom:10px;transition:transform .1s}
.c-card.near{border-color:var(--or);background:#fffdf4}
.c-card.st-venta{border-left:5px solid var(--ok)}
.c-card.st-sin{border-left:5px solid var(--bad)}
.c-card.st-pend{border-left:5px solid var(--or)}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.c-name{font-size:15px;font-weight:800;margin:0;line-height:1.25}
.dist-badge{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap;flex:none}
.dist-badge.in100{background:var(--or);color:#14213d}
.c-meta{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.35}
.c-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.st-btn{font:inherit;font-size:11.5px;font-weight:800;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--mute);cursor:pointer;text-align:center}
.st-btn.on-pend{background:var(--soft);border-color:var(--or);color:#8a6300}
.st-btn.on-venta{background:#e6f7ed;border-color:var(--ok);color:var(--ok)}
.st-btn.on-sin{background:#fdeaea;border-color:var(--bad);color:var(--bad)}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px 0}
.f-chip{font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--mute);cursor:pointer;white-space:nowrap}
.f-chip.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.gps-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);padding:10px 12px;border-radius:14px;margin-bottom:12px;font-size:12.5px}
</style>
</head>
<body>
<div id="lock"><h2 id="lkT">Verificando acceso…</h2><p id="lkP">Un momento, por favor.</p>
  <div id="lkF" hidden><input id="lkE" type="email" placeholder="tu@correo.com" autocomplete="email" aria-label="Correo"><button class="btn" id="lkS">Enviar enlace de acceso</button></div>
  <button class="btn g" id="lkB" hidden>Cerrar sesión</button></div>

<div class="app">
<header>
  <div class="logo" id="logo"></div>
  <div><h1 id="cname">Mi Empresa</h1><p id="date"></p></div>
  <button class="btn g" id="out" hidden style="margin-left:auto;padding:6px 12px;font-size:12px">Salir</button>
</header>

<div class="card" style="margin-bottom:14px">
  <label for="tI" style="margin-top:0">Mi ruta asignada</label>
  <input id="tI" list="tL" placeholder="Ruta 01" autocomplete="off" autocapitalize="characters"><datalist id="tL"></datalist>
  <div class="small bad" id="tE" role="status"></div>
</div>

<!-- VISTA 1: MI RUTA (KPIS Y PRODUCTOS) -->
<main id="v-kpi">
  <p class="hi">Hola 👋</p>
  <p class="sub">Avance de ventas · cifras en cajas</p>
  <div id="tB"></div>
</main>

<!-- VISTA 2: CLIENTES Y MAPA OSM -->
<main id="v-cli" hidden>
  <p class="hi">Clientes y Mapa 📍</p>
  <p class="sub">Ordenados del más cercano al más lejano según tu ubicación</p>

  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label style="margin:0">Día de visita</label>
      <span class="small" id="cliCount" style="margin:0;font-weight:700"></span>
    </div>
    <div class="day-pills" id="dayPills">
      <button type="button" class="day-pill" data-d="Lu">Lun</button>
      <button type="button" class="day-pill" data-d="Ma">Mar</button>
      <button type="button" class="day-pill" data-d="Mi">Mié</button>
      <button type="button" class="day-pill" data-d="Ju">Jue</button>
      <button type="button" class="day-pill" data-d="Vi">Vie</button>
      <button type="button" class="day-pill" data-d="Sa">Sáb</button>
    </div>
  </div>

  <div class="gps-bar">
    <div id="gpsStatus">📍 Buscando ubicación GPS…</div>
    <button type="button" class="btn sm" id="btnGps" style="white-space:nowrap">Actualizar GPS</button>
  </div>

  <!-- Mapa OpenStreetMap -->
  <div class="card" style="padding:10px;margin-bottom:14px">
    <div id="osmMap" class="map-box"></div>
    <div class="map-leg">
      <span class="dot-leg"><i style="background:#f7b500"></i>No visitado</span>
      <span class="dot-leg"><i style="background:#1a9a4f"></i>Con venta</span>
      <span class="dot-leg"><i style="background:#d62828"></i>Sin venta</span>
      <span class="dot-leg"><i style="background:#2563eb;border:2px solid #fff;box-shadow:0 0 0 1.5px #2563eb"></i>Mi ubicación (100m)</span>
    </div>
  </div>

  <div class="filter-row" id="cliFilters">
    <button type="button" class="f-chip act" data-f="all">Todos</button>
    <button type="button" class="f-chip" data-f="100m">En radio 100m</button>
    <button type="button" class="f-chip" data-f="pend">No visitados</button>
    <button type="button" class="f-chip" data-f="venta">Con venta</button>
    <button type="button" class="f-chip" data-f="sin">Sin venta</button>
  </div>

  <div id="cliList"></div>
</main>
</div>

<nav>
  <button id="navKpi" type="button" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
    Mi venta
  </button>
  <button id="navCli" type="button" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.5-6-10a6 6 0 0112 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
    Clientes
  </button>
</nav>

    g+='<text x="'+cx+'" y="'+(T+ph-h-5)+'" font-size="11" text-anchor="middle" fill="var(--mute)">'+fm(v)+' cj</text>';
    g+='<text x="'+cx+'" y="'+(H-26)+'" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">'+esc(w[0])+'</text>';
    g+='<text x="'+cx+'" y="'+(H-12)+'" font-size="11" text-anchor="middle" fill="var(--mute)">'+esc(w.slice(1).join(' '))+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Venta por producto">'+g+'</svg>'}

function render(){
  $('cname').textContent=S.name||'Mi Empresa';document.title=(S.name||'Mi Empresa')+' · Mi ruta';
  $('logo').innerHTML=S.logo?'<img alt="Logotipo" src="'+S.logo+'">':LOGO;
  var ks=Object.keys(S.sales).sort(),cut=ks.length?ks[ks.length-1]:'';
  $('date').textContent=cut?'Datos al '+(+cut.slice(8))+' '+AB[+cut.slice(5,7)-1]:'Sin ventas cargadas';
  $('tL').innerHTML=routes().map(function(r){return '<option value="'+rName(r)+'">'}).join('');
  if(!RT||routes().indexOf(RT)<0){
    $('tB').innerHTML='<p class="small">Escribe tu ruta arriba (por ejemplo, Ruta 01) para ver tu información.</p>';
    renderClients();
    return;
  }
  var c=calc(RT),G=c.mg>0,pm=G?c.mes/c.mg*100:0,ps=c.sg>0?c.sem/c.sg*100:0,mo=c.mon,su=c.sun;
  var wl='Sem '+mo.getDate()+(mo.getMonth()===su.getMonth()?'':' '+AB[mo.getMonth()])+' - '+su.getDate()+' '+AB[su.getMonth()];
  var pc=function(v,ok){return ok?'<b class="'+cls(v)+'">'+v.toFixed(0)+'%</b>':'<b>–</b>'};
  var req=G&&c.wr>0?Math.max(c.mg-c.mes,0)/c.wr:null,ag=skuAgg(c),a=ag.a;
  var tg=function(v){return '<button class="'+(TV===v?'btn':'btn g')+'" data-v="'+v+'" style="padding:8px 14px">'+(v==='m'?'Mes':'Semana')+'</button>'};
  $('tB').innerHTML='<h2 style="margin-top:6px">'+rName(RT)+'</h2>'
   +'<div class="grid"><div class="card"><div class="lbl">Ventas del mes</div><div class="big">'+fm(c.mes)+'</div><div class="foot"><div><div class="lbl">% cumpl.</div>'+pc(pm,G)+'</div><div style="text-align:right"><div class="lbl">Meta mes</div><b>'+(G?fm(c.mg):'–')+'</b></div></div></div>'
   +'<div class="card"><div class="lbl">'+wl+'</div><div class="big">'+fm(c.sem)+'</div><div class="foot"><div><div class="lbl">% cumpl.</div>'+pc(ps,c.sg>0)+'</div><div style="text-align:right"><div class="lbl">Meta sem.</div><b>'+(c.sg>0?fm(c.sg):'–')+'</b></div></div></div>'
   +'<div class="card wide"><div class="foot" style="margin-top:0"><div><div class="lbl">Mi promedio diario actual</div><b style="font-size:24px">'+fm(c.we>0?c.mes/c.we:0)+' <span class="lbl">cj/día</span></b></div><div style="text-align:right"><div class="lbl">Objetivo diario requerido</div><b class="bad" style="font-size:24px">'+(req===null?'–':fm(req))+' <span class="lbl">cj/día</span></b></div></div>'
   +'<div class="small">'+(G?(c.wr>0?'Para lograr tu meta de '+fm(c.mg)+' cajas en los '+c.wr+' día(s) hábil(es) que quedan del mes.':'Ya no quedan días hábiles en el mes.'):'Sin meta asignada este mes.')+'</div></div></div>'
   +'<h2>Mi venta por día</h2><div style="display:flex;gap:8px;margin-bottom:8px">'+tg('m')+tg('s')+'</div>'
   +'<div class="card chart">'+dayChart(dayItems(c))+'</div>'
   +'<h2>Venta por producto</h2><div class="card"><div class="lbl">Total '+(TV==='m'?'del mes':'de la semana')+': '+fm(a.tot)+' cajas</div>'+(ag.days?skuSvg(a):'')
   +'<p class="small">'+(ag.days?'% sobre la venta total de tu ruta.':'Aún no hay detalle por producto de tu ruta en este periodo.')+(ag.days&&ag.miss?' Faltan '+ag.miss+' día(s) sin detalle.':'')+'</p></div>';
  renderClients();
}

/* ==================== LOGICA DE CLIENTES, DISTANCIA Y OPENSTREETMAP ==================== */
function haversine(lat1,lon1,lat2,lon2){
  var R=6371000,toRad=Math.PI/180;
  var dLat=(lat2-lat1)*toRad,dLon=(lon2-lon1)*toRad;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(m){
  if(m==null)return 'Sin GPS';
  return m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';
}
function todayKey(){return kd(new Date())}
function getClientStatus(cid){
  var tk=todayKey();
  return (visits[tk]&&visits[tk][cid])||'pend'; // 'pend' | 'venta' | 'sin'
}
function setClientStatus(cid,st){
  var tk=todayKey();
  if(!visits[tk])visits[tk]={};
  if(st==='pend')delete visits[tk][cid];
  else visits[tk][cid]=st;
  try{localStorage.setItem('termVisits',JSON.stringify(visits))}catch(e){}
  if(FB&&RT){
    try{FB.doc('visits/'+tk+'_'+RT).set({ruta:RT,fecha:tk,estados:visits[tk],updatedAt:new Date().toISOString()},{merge:true})}catch(e){}
  }
  renderClients();
}
function loadFirestoreVisits(){
  if(!FB||!RT)return;
  var tk=todayKey();
  FB.doc('visits/'+tk+'_'+RT).onSnapshot(function(doc){
    if(doc.exists&&doc.data().estados){
      visits[tk]=doc.data().estados;
      try{localStorage.setItem('termVisits',JSON.stringify(visits))}catch(e){}
      if(curTab==='cli')renderClients();
    }
  },function(){});
}

function initMap(){
  if(osmMap||!window.L)return;
  osmMap=L.map('osmMap',{zoomControl:true}).setView([23.225,-106.415],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(osmMap);
  osmLayer=L.layerGroup().addTo(osmMap);
  userLayer=L.layerGroup().addTo(osmMap);
}

function requestGps(){
  if(!navigator.geolocation){
    $('gpsStatus').textContent='⚠️ Tu navegador no soporta GPS.';
    return;
  }
  $('gpsStatus').textContent='📡 Obteniendo ubicación exacta…';
  navigator.geolocation.getCurrentPosition(function(pos){
    userPos={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0)};
    $('gpsStatus').innerHTML='📍 Ubicación activa <span class="small">(±'+userPos.acc+' m)</span>';
    renderClients(true);
  },function(err){
    $('gpsStatus').textContent='⚠️ Activa el GPS para ordenar por cercanía.';
  },{enableHighAccuracy:true,timeout:12000,maximumAge:10000});

  if(gpsWatchId===null){
    gpsWatchId=navigator.geolocation.watchPosition(function(pos){
      userPos={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:Math.round(pos.coords.accuracy||0)};
      $('gpsStatus').innerHTML='📍 Ubicación activa <span class="small">(±'+userPos.acc+' m)</span>';
      if(curTab==='cli')renderClients(false);
    },function(){},{enableHighAccuracy:true,maximumAge:15000});
  }
}

function markerIcon(color){
  return L.divIcon({
    className:'custom-pin',
    html:'<div style="width:18px;height:18px;border-radius:50%;background:'+color+';border:2.5px solid #ffffff;box-shadow:0 2px 6px rgba(0,0,0,.35)"></div>',
    iconSize:[18,18],
    iconAnchor:[9,9],
    popupAnchor:[0,-10]
  });
}

function renderClients(recenter){
  // Actualizar estado visual de los botones de día
  var pills=$('dayPills').querySelectorAll('.day-pill');
  for(var i=0;i<pills.length;i++){
    pills[i].classList.toggle('act',pills[i].dataset.d===selDay);
  }
  var fchips=$('cliFilters').querySelectorAll('.f-chip');
  for(var j=0;j<fchips.length;j++){
    fchips[j].classList.toggle('act',fchips[j].dataset.f===cliFilter);
  }

  if(!RT||!CLIENTS_DB[RT]){
    $('cliCount').textContent='0 clientes';
    $('cliList').innerHTML='<div class="card"><p class="small" style="margin:0">'+(RT?'No hay catálogo de clientes cargado para '+rName(RT)+'.':'Selecciona tu ruta arriba para ver tus clientes.')+'</p></div>';
    return;
  }

  // Filtrar clientes del día seleccionado
  var raw=CLIENTS_DB[RT].filter(function(c){return c.d&&c.d.indexOf(selDay)>=0});

  // Calcular distancia desde ubicación actual
  var enriched=raw.map(function(c){
    var dist=(userPos&&c.lat!=null&&c.lon!=null)?haversine(userPos.lat,userPos.lon,c.lat,c.lon):null;
    var st=getClientStatus(c.id);
    return {c:c,dist:dist,st:st,in100:(dist!==null&&dist<=100)};
  });

  // Ordenar desde el más cercano al más lejano (los que no tienen GPS van al final)
  enriched.sort(function(a,b){
    if(a.dist===null&&b.dist===null)return a.c.n.localeCompare(b.c.n);
    if(a.dist===null)return 1;
    if(b.dist===null)return -1;
    return a.dist-b.dist;
  });

  var in100Count=enriched.filter(function(x){return x.in100}).length;
  $('cliCount').textContent=enriched.length+' clientes'+(userPos?' · '+in100Count+' a ≤100m':'');

  // Aplicar filtro de vista
  var filtered=enriched.filter(function(x){
    if(cliFilter==='100m')return x.in100;
    if(cliFilter==='pend')return x.st==='pend';
    if(cliFilter==='venta')return x.st==='venta';
    if(cliFilter==='sin')return x.st==='sin';
    return true;
  });

  // Actualizar Mapa OpenStreetMap
  if(curTab==='cli'){
    initMap();
    if(osmMap&&osmLayer&&userLayer){
      osmLayer.clearLayers();
      userLayer.clearLayers();
      var bounds=[];

      if(userPos){
        L.circle([userPos.lat,userPos.lon],{
          radius:100,
          color:'#2563eb',
          weight:2,
          fillColor:'#3b82f6',
          fillOpacity:0.14
        }).addTo(userLayer);

        L.marker([userPos.lat,userPos.lon],{
          icon:L.divIcon({
            className:'user-pin',
            html:'<div style="width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.35)"></div>',
            iconSize:[16,16],
            iconAnchor:[8,8]
          })
        }).bindPopup('<b>Mi ubicación actual</b><br>Radio de cobertura: 100 m').addTo(userLayer);
        bounds.push([userPos.lat,userPos.lon]);
      }

      enriched.forEach(function(item){
        var c=item.c;
        if(c.lat==null||c.lon==null)return;
        var col=item.st==='venta'?'#1a9a4f':(item.st==='sin'?'#d62828':'#f7b500');
        var stLabel=item.st==='venta'?'Con venta':(item.st==='sin'?'Sin venta':'No visitado');
        var m=L.marker([c.lat,c.lon],{icon:markerIcon(col)});
        var pop='<div style="font-family:inherit;min-width:170px">'
          +'<b style="font-size:13px">'+esc(c.n)+'</b><br>'
          +'<span style="font-size:11px;color:#5b6b8c">'+esc(c.dir||'Sin dirección')+'</span><br>'
          +'<span style="font-size:11.5px;font-weight:700">Distancia: '+fmtDist(item.dist)+'</span> · '
          +'<span style="font-size:11.5px;font-weight:800;color:'+col+'">'+stLabel+'</span>'
          +'</div>';
        m.bindPopup(pop);
        m.addTo(osmLayer);
        if(!userPos)bounds.push([c.lat,c.lon]);
      });

      if(recenter!==false){
        if(userPos){
          osmMap.setView([userPos.lat,userPos.lon],17);
        }else if(bounds.length){
          osmMap.fitBounds(bounds,{padding:[24,24],maxZoom:16});
        }
      }
      setTimeout(function(){osmMap.invalidateSize()},80);
    }
  }

  // Renderizar listado de tarjetas
  if(!filtered.length){
    $('cliList').innerHTML='<div class="card"><p class="small" style="margin:0">No hay clientes que coincidan con este filtro para el día seleccionado.</p></div>';
    return;
  }

  $('cliList').innerHTML=filtered.map(function(item){
    var c=item.c,st=item.st;
    var cardCls='c-card st-'+st+(item.in100?' near':'');
    var badgeCls='dist-badge'+(item.in100?' in100':'');
    var distTxt=item.dist!==null?(item.in100?'📍 '+fmtDist(item.dist)+' (En rango)':fmtDist(item.dist)):'Sin coordenadas';
    var navUrl=(c.lat!=null&&c.lon!=null)?'https://www.openstreetmap.org/?mlat='+c.lat+'&mlon='+c.lon+'#map=18/'+c.lat+'/'+c.lon:'';
    return '<div class="'+cardCls+'">'
      +'<div class="c-top">'
        +'<h3 class="c-name">'+esc(c.n)+'</h3>'
        +'<span class="'+badgeCls+'">'+distTxt+'</span>'
      +'</div>'
      +'<div class="c-meta">'
        +(c.dir?'<div>🏠 '+esc(c.dir)+'</div>':'')
        +(c.con||c.tel?'<div>👤 '+esc(c.con||'Contacto')+(c.tel?' · 📞 <a href="tel:'+esc(c.tel)+'" style="color:inherit;font-weight:700">'+esc(c.tel)+'</a>':'')+'</div>':'')
        +(navUrl?'<div style="margin-top:3px"><a href="'+navUrl+'" target="_blank" rel="noopener" style="color:#14213d;font-weight:700;font-size:11.5px;text-decoration:underline">Abrir ubicación en mapa ↗</a></div>':'')
      +'</div>'
      +'<div class="c-actions">'
        +'<button type="button" class="st-btn'+(st==='pend'?' on-pend':'')+'" data-cid="'+c.id+'" data-st="pend">No visitado</button>'
        +'<button type="button" class="st-btn'+(st==='venta'?' on-venta':'')+'" data-cid="'+c.id+'" data-st="venta">Con venta</button>'
        +'<button type="button" class="st-btn'+(st==='sin'?' on-sin':'')+'" data-cid="'+c.id+'" data-st="sin">Sin venta</button>'
      +'</div>'
    +'</div>';
  }).join('');
}

function switchTab(t){
  curTab=t;
  $('v-kpi').hidden=(t!=='kpi');
  $('v-cli').hidden=(t!=='cli');
  $('navKpi').setAttribute('aria-selected',t==='kpi');
  $('navCli').setAttribute('aria-selected',t==='cli');
  if(t==='cli'){
    renderClients(true);
    if(!userPos)requestGps();
  }
  window.scrollTo(0,0);
}

$('navKpi').onclick=function(){switchTab('kpi')};
$('navCli').onclick=function(){switchTab('cli')};
$('dayPills').onclick=function(e){
  var b=e.target.closest('.day-pill');
  if(!b)return;
  selDay=b.dataset.d;
  renderClients(false);
};
$('cliFilters').onclick=function(e){
  var b=e.target.closest('.f-chip');
  if(!b)return;
  cliFilter=b.dataset.f;
  renderClients(false);
};
$('cliList').onclick=function(e){
  var b=e.target.closest('.st-btn');
  if(!b)return;
  setClientStatus(b.dataset.cid,b.dataset.st);
};
$('btnGps').onclick=function(){requestGps()};

$('tB').onclick=function(e){var b=e.target.closest('[data-v]');if(!b)return;TV=b.dataset.v;render()};
$('tI').oninput=function(){var v=this.value,r=parseR(v);if(!v.trim()){$('tE').textContent='';return}
  if(r&&routes().indexOf(r)>=0){RT=r;try{localStorage.setItem('termRoute',r)}catch(e){}$('tE').textContent='';loadFirestoreVisits();render()}else $('tE').textContent='No encontré esa ruta.'};

function signOut(){(AU?AU.signOut():Promise.resolve()).then(function(){try{localStorage.removeItem('fbEmail')}catch(e){}location.reload()})}
$('lkB').onclick=signOut;$('out').onclick=signOut;
$('lkS').onclick=async function(){var e=$('lkE').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(e)){$('lkP').textContent='Escribe un correo válido.';return}
  $('lkS').disabled=true;
  try{await AU.sendSignInLinkToEmail(e,{url:location.origin+location.pathname,handleCodeInApp:true});try{localStorage.setItem('fbEmail',e)}catch(x){}
    $('lkP').textContent='Listo. Revisa tu correo ('+e+') y abre el enlace en este mismo dispositivo para entrar.'}
  catch(x){$('lkP').textContent='No se pudo enviar el enlace: '+(x&&x.message||'error')}
  $('lkS').disabled=false};

function unlock(){
  unlocked=true;
  document.body.classList.add('in');
  $('lock').hidden=true;
  $('out').hidden=false;
  $('tI').value=RT?rName(RT):'';
  loadFirestoreVisits();
  render();
}

async function boot(){
  try{
    if(!window.firebase||typeof FIREBASE_CONFIG==='undefined'||FIREBASE_CONFIG.projectId.indexOf('TU-')===0)return showLogin('Falta configurar Firebase','Edita config.js (ver README.md).',true);
    firebase.initializeApp(FIREBASE_CONFIG);AU=firebase.auth();FB=firebase.firestore();
    if(AU.isSignInWithEmailLink(location.href)){
      var e0=null;try{e0=localStorage.getItem('fbEmail')}catch(x){}
      if(!e0)e0=(prompt('Escribe tu correo para confirmar el acceso:')||'').trim().toLowerCase();
      try{await AU.signInWithEmailLink(e0,location.href);try{localStorage.removeItem('fbEmail')}catch(x){}history.replaceState(null,'',location.pathname)}
      catch(x){return showLogin('Enlace no válido','El enlace expiró, ya se usó o el correo no coincide. Pide uno nuevo.')}
    }
    var us=await new Promise(function(res){var off=AU.onAuthStateChanged(function(u){off();res(u)})});
    if(!us)return showLogin();
    var em=(us.email||'').toLowerCase(),me;
    try{me=await FB.doc('users/'+em).get()}catch(x){return noAccess(em)}
    if(!me.exists)return noAccess(em);
    var refs=['config','sales','sku'].map(function(k){return FB.doc('app/'+k)});
    var er=function(){if(!unlocked)showLogin('No se pudo cargar','No tienes acceso a los datos o hubo un problema de conexión.',true)};
    refs[0].onSnapshot(function(x){applyCfg(x.exists?x.data():null);if(unlocked)render();else unlock()},er);
    refs[1].onSnapshot(function(x){applySales(x.exists?x.data():null);if(unlocked)render()},er);
    refs[2].onSnapshot(function(x){applySku(x.exists?x.data():null);if(unlocked)render()},er)
  }catch(e){showLogin('No se pudo iniciar','Ocurrió un error al conectar. Revisa tu conexión e intenta de nuevo.',true)}
}
boot();
